[project]
name = "parkinson-clf"
version = "0.1.0"
description = "Classificazione binaria di Parkinson da misure vocali (UCI Parkinsons): 3 classificatori scikit-learn + baseline, pipeline riproducibile"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.5",
    "pandas>=2.2",
    "scipy>=1.11,<1.18",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkinson_clf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
